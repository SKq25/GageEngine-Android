name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:mono-4.3
    steps:
      - uses: actions/checkout@v4
      - name: Extract GAGE source
        run: unzip -oq gage_v3_nounity.zip
      - name: Setup Android, Java and .NET
        run: |
          curl -fsSL "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse" -o /tmp/jdk17.tar.gz
          mkdir -p /opt/jdk17
          tar -xzf /tmp/jdk17.tar.gz -C /opt/jdk17 --strip-components=1
          echo "JAVA_HOME=/opt/jdk17" >> "$GITHUB_ENV"
          echo "/opt/jdk17/bin" >> "$GITHUB_PATH"
          export JAVA_HOME=/opt/jdk17
          export PATH="$JAVA_HOME/bin:$PATH"
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir /usr/share/dotnet
          echo "DOTNET_ROOT=/usr/share/dotnet" >> "$GITHUB_ENV"
          echo "/usr/share/dotnet" >> "$GITHUB_PATH"
          export DOTNET_ROOT=/usr/share/dotnet
          export PATH="$DOTNET_ROOT:$PATH"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" -o /tmp/android-tools.zip
          mkdir -p /tmp/android-sdk-extract /usr/lib/android-sdk/cmdline-tools/latest
          unzip -q /tmp/android-tools.zip -d /tmp/android-sdk-extract
          mv /tmp/android-sdk-extract/cmdline-tools/* /usr/lib/android-sdk/cmdline-tools/latest/
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          yes | /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/lib/android-sdk --licenses
          /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/lib/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          ls -lah /root/.local/share/godot/export_templates || true
          mv /root/.local/share/godot/export_templates/4.3.stable.mono ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -lah "$HOME/.local/share/godot/export_templates/4.3.stable.mono" || true
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable.mono/android_debug.apk"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > ~/.config/godot/editor_settings-4.tres <<'EOS'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/opt/jdk17"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.tres
      - name: Compile C# scripts
        working-directory: GAGE
        run: dotnet build GAGE.csproj --configuration Debug --nologo
      - name: Build APK
        working-directory: GAGE
        run: |
          mkdir -p build
          godot --headless --verbose --path . --import
          godot --headless --verbose --path . --export-debug "Android" build/GAGE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GAGE-apk
          path: GAGE/build/GAGE.apk
